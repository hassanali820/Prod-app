# Shared routes for the public site. Docker DNS is re-resolved so container restarts don't break nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

client_max_body_size 25m;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Supabase Auth (GoTrue)  ->  /auth/v1/*
location /auth/v1/ {
    set $auth_upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth_upstream;
}

# Supabase REST (PostgREST)  ->  /rest/v1/*
location /rest/v1/ {
    set $rest_upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_upstream;
}

# Application (UI + /api/*). Grading can take up to ~60 s.
location / {
    set $app_upstream http://app:3000;
    proxy_pass $app_upstream;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
