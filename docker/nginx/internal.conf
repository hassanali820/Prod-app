# Internal-only endpoint the app server uses (SUPABASE_URL=http://nginx:8000). Not published to the host.
server {
    listen 8000;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 25m;

    location /auth/v1/ {
        set $auth_upstream http://auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }
    location /rest/v1/ {
        set $rest_upstream http://rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $rest_upstream;
    }
}
